<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8">
      <link rel="icon" href="/favicon2.ico" sizes="any">
      <link rel="icon" href="/favicon2.svg" type="image/svg+xml">
      <link rel="icon" href="/favicon2.png" type="image/png" sizes="32x32">
      <link rel="apple-touch-icon" href="/favicon2.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="База танцевальных движений: танцы, описания, уровни и видео">
    <title>Dance Moves — база танцевальных движений</title>
    <script>
      // Применяем сохранённую (или системную) тему до монтирования приложения,
      // чтобы не было вспышки светлой темы при перезагрузке в тёмной теме.
      (function () {
        try {
          var stored = localStorage.getItem('dance-moves:theme');
          var theme = stored === 'light' || stored === 'dark'
            ? stored
            : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          document.documentElement.dataset.theme = theme;

          var scale = Number(localStorage.getItem('dance-moves:font-scale'));
          if (scale === 1 || scale === 1.25 || scale === 1.5) {
            document.documentElement.style.setProperty('--font-scale', String(scale));
          }
        } catch (e) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
